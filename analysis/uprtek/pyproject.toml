[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolume-uprtek"
version = "0.1.0"
description = "UPRtek MK350S capture and spectral analysis for Chronolume (independent of HOSI)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Capture runs under 32-bit Python (the vendor mkusb.dll is 32-bit) and needs only the stdlib.
# Analysis runs under 64-bit Python.
analysis = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]
dev = ["pytest>=8"]

[project.scripts]
chronolume-uprtek-sweep = "uprtek.sweep:main"
chronolume-uprtek-probe = "uprtek.probe:main"
chronolume-uprtek-model-sweep = "uprtek.model.capture:main"
chronolume-uprtek-frames = "uprtek.frames:main"
chronolume-uprtek-frame-sweep = "uprtek.frame_capture:main"
chronolume-uprtek-frame-check = "uprtek.model.frame_check:main"
chronolume-uprtek-grid-sweep = "uprtek.grid_capture:main"
chronolume-uprtek-grid-check = "uprtek.grid_check:main"
chronolume-uprtek = "uprtek.report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uprtek = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
